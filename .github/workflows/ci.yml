name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'C3 compiler version to use'
        required: false
        default: 'v0.8.5'

env:
  C3_VERSION: v0.8.5

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Sets up cl.exe/link.exe and the INCLUDE/LIB/PATH env vars for x64,
      # required for the Windows stub build step below. No-op on Linux/macOS.
      - name: Set up MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Install c3c from the official release assets (no third-party setup action).
      # Asset names per platform: c3-linux.tar.gz, c3-macos.zip, c3-windows.zip.
      # github.com/c3lang/c3c/releases has shown individual release assets
      # stuck returning 504 for extended periods (observed: one platform's
      # asset failing consistently for minutes while another platform's
      # asset on the same release succeeds immediately); a short retry
      # can't tell a stuck object from a brief blip, so fall through a
      # couple of nearby releases rather than retrying the same one forever.
      # Falls forward (never to an older release) to stay compatible with
      # whatever C3 syntax this binding actually uses.
      - name: Install c3c
        shell: bash
        run: |
          set -e
          PRIMARY="${{ github.event.inputs.version || env.C3_VERSION }}"
          case "$RUNNER_OS" in
            Linux)   asset=c3-linux.tar.gz ;;
            macOS)   asset=c3-macos.zip ;;
            Windows) asset=c3-windows.zip ;;
          esac
          for VERSION in "$PRIMARY" v0.8.5_1 latest-prerelease-tag; do
            echo "Trying c3c ${VERSION}..."
            if curl -fsSL --retry 3 --retry-delay 10 --retry-connrefused --retry-all-errors \
                 -o "$asset" "https://github.com/c3lang/c3c/releases/download/${VERSION}/${asset}"
            then
              echo "Downloaded c3c ${VERSION}."
              break
            fi
            echo "c3c ${VERSION} download failed, trying the next fallback version."
            rm -f "$asset"
          done
          test -f "$asset" || { echo "::error::could not download c3c from any of: $PRIMARY v0.8.5_1 latest-prerelease-tag"; exit 1; }
          mkdir -p c3c-install
          case "$asset" in
            *.tar.gz) tar xzf "$asset" -C c3c-install ;;
            *.zip)
              if [ "$RUNNER_OS" = Windows ]; then
                7z x -y -bd "$asset" -oc3c-install >/dev/null
              else
                unzip -q "$asset" -d c3c-install
              fi ;;
          esac
          # the release archives unpack to a top-level c3/ directory
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$(cygpath -w "$PWD/c3c-install/c3")" >> "$GITHUB_PATH"
          else
            echo "$PWD/c3c-install/c3" >> "$GITHUB_PATH"
          fi
          # macOS release zip is unsigned; drop the quarantine attribute if present
          if [ "$RUNNER_OS" = macOS ]; then
            xattr -d com.apple.quarantine c3c-install/c3/c3c 2>/dev/null || true
          fi

      - name: c3c version
        shell: bash
        run: c3c -V

      # Primary check: the static-lib target has zero external dependencies, so
      # this validates that the whole C3 binding compiles cleanly on this OS.
      - name: Build binding (c3c build llama)
        shell: bash
        run: c3c build llama

      # ---------------------------------------------------------------------
      # Integration smoke test: build and run the 'generate' example against
      # a FAKE stub libllama (.github/ci-stub/stub_llama.c) instead of a real
      # (slow) llama.cpp build. This exercises the full build+link+run
      # pipeline, including project.json's "linked-libraries" for the
      # generate target, on every platform.
      # ---------------------------------------------------------------------

      # The stub compiles against upstream's real headers for ABI-correct
      # struct layouts, but this repo does not commit a copy of them; fetch
      # just the handful of files needed, pinned to one llama.cpp commit for
      # reproducibility.
      - name: Fetch upstream llama.cpp/ggml headers for the stub build
        shell: bash
        env:
          LLAMA_CPP_COMMIT: d6be065572cdb7bf64014c8c5771e210c9570e44
        run: |
          set -e
          mkdir -p upstream-headers
          base="https://raw.githubusercontent.com/ggml-org/llama.cpp/${LLAMA_CPP_COMMIT}"
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused -o upstream-headers/llama.h "${base}/include/llama.h"
          for f in ggml.h ggml-backend.h ggml-cpu.h ggml-opt.h ggml-alloc.h; do
            curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused -o "upstream-headers/${f}" "${base}/ggml/include/${f}"
          done
          ls -la upstream-headers

      # Linux/macOS: plain cc/clang, verified locally on Linux (see
      # .github/ci-stub/ for the exact commands this mirrors).
      - name: Build stub libllama (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          mkdir -p .github/ci-stub/lib
          case "$RUNNER_OS" in
            Linux) ext=so ;;
            macOS) ext=dylib ;;
          esac
          cc -fPIC -shared -O2 \
            -I.github/ci-stub -Iupstream-headers \
            .github/ci-stub/stub_llama.c \
            -o ".github/ci-stub/lib/libllama.$ext"
          for lib in ggml ggml-base ggml-cpu; do
            cc -fPIC -shared -x c /dev/null -o ".github/ci-stub/lib/lib${lib}.$ext"
          done
          ls -la .github/ci-stub/lib

      # Windows: MSVC cl.exe (set up by ilammy/msvc-dev-cmd above). LLAMA_API
      # in upstream llama.h only expands to __declspec(dllexport) when
      # LLAMA_SHARED+LLAMA_BUILD are both defined; without them a Windows
      # DLL exports nothing and MSVC skips generating the .lib entirely.
      - name: Build stub libllama (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $StubDir = "ci-stub-lib"
          New-Item -ItemType Directory -Force -Path $StubDir | Out-Null

          cl.exe /nologo /LD /MD /O2 `
            /I "upstream-headers" /I ".github\ci-stub" `
            /DLLAMA_SHARED /DLLAMA_BUILD `
            ".github\ci-stub\stub_llama.c" `
            "/Fe:$StubDir\llama.dll" `
            /link "/IMPLIB:$StubDir\llama.lib"
          if ($LASTEXITCODE -ne 0) { throw "Failed to build llama.dll stub" }

          # MSVC only emits an import library if the DLL exports at least
          # one symbol, so these stand-ins need one dummy export each.
          Set-Content -Path "$StubDir\dummy_ggml.c" -Value '__declspec(dllexport) void ggml_stub_anchor(void) {}'
          foreach ($lib in @('ggml', 'ggml-base', 'ggml-cpu')) {
            cl.exe /nologo /LD /MD "$StubDir\dummy_ggml.c" "/Fe:$StubDir\$lib.dll" /link "/IMPLIB:$StubDir\$lib.lib"
            if ($LASTEXITCODE -ne 0) { throw "Failed to build $lib.dll stub" }
          }
          Remove-Item "$StubDir\*.obj", "$StubDir\*.exp" -Force -ErrorAction SilentlyContinue
          Get-ChildItem $StubDir

      # Unit tests (test/*.c3) against the stub, same linking setup as the
      # generate build below. c3c links+runs the test binary itself, so the
      # runtime loader path needs to be set here too, not just -L.
      - name: Run unit tests against stub
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              libdir="ci-stub-lib"
              PATH="$PWD/$libdir:$PATH" c3c test llama -L "$libdir" ;;
            macOS)
              libdir=".github/ci-stub/lib"
              DYLD_LIBRARY_PATH="$PWD/$libdir" c3c test llama -L "$libdir" ;;
            *)
              libdir=".github/ci-stub/lib"
              LD_LIBRARY_PATH="$PWD/$libdir" c3c test llama -L "$libdir" ;;
          esac

      # project.json's generate target already declares linked-libraries, so
      # only the search path (-L) needs to be supplied here.
      - name: Build generate against stub
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) libdir="ci-stub-lib" ;;
            *)       libdir=".github/ci-stub/lib" ;;
          esac
          c3c build generate -L "$libdir"

      # Smoke-run the binary against the stub; no real GGUF model is needed
      # since the stub fakes every llama_* call.
      - name: Run generate smoke test
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              PATH="$PWD/ci-stub-lib:$PATH" ./build/generate.exe fake.gguf "The capital of France is" ;;
            macOS)
              DYLD_LIBRARY_PATH="$PWD/.github/ci-stub/lib" ./build/generate fake.gguf "The capital of France is" ;;
            *)
              LD_LIBRARY_PATH="$PWD/.github/ci-stub/lib" ./build/generate fake.gguf "The capital of France is" ;;
          esac
